name: Build and Release Binaries

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'index.html'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'index.html'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name "Olympus" --icon "icon.ico" --add-data "icon.png;." --hidden-import="pynput.keyboard._win32" --hidden-import="pynput.mouse._win32" --hidden-import="pyperclip" main.py

    - name: Build Installer
      run: |
        iscc Olympus_Setup.iss

    - name: Upload Standalone EXE
      uses: actions/upload-artifact@v4
      with:
        name: Olympus-Portable
        path: dist/Olympus.exe

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Olympus-Windows-Installer
        path: Output/Olympus-Setup.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          portaudio19-dev \
          python3-pyaudio \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libegl1 \
          libgl1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name "Olympus" --add-data "icon.png:." --hidden-import="pynput.keyboard._xorg" --hidden-import="pynput.mouse._xorg" --hidden-import="pyperclip" main.py

    - name: Upload Linux Binary
      uses: actions/upload-artifact@v4
      with:
        name: Olympus-Linux
        path: dist/Olympus

  release:
    name: Update GitHub Release
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - name: Download Windows Portable
      uses: actions/download-artifact@v4
      with:
        name: Olympus-Portable
        path: release-files

    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: Olympus-Windows-Installer
        path: release-files

    - name: Download Linux Executable
      uses: actions/download-artifact@v4
      with:
        name: Olympus-Linux
        path: release-files

    - name: Generate Checksums and set permissions
      run: |
        chmod +x release-files/Olympus
        cd release-files
        sha256sum Olympus.exe Olympus-Setup.exe Olympus > SHA256SUMS.txt
        cat SHA256SUMS.txt
        ls -lh

    - name: Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Olympus v1.0.0
        files: |
          release-files/Olympus.exe
          release-files/Olympus-Setup.exe
          release-files/Olympus
          release-files/SHA256SUMS.txt
        token: ${{ secrets.GITHUB_TOKEN }}
