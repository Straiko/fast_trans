name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -------------------------------------------------------------------------
  # Run tests on Linux and Windows, across Python 3.10 – 3.12
  # -------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            portaudio19-dev \
            python3-pyaudio \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libegl1 \
            libgl1 \
            xvfb

      - name: Install PyAudio (Windows)
        if: runner.os == 'Windows'
        run: pip install pipwin && pipwin install pyaudio
        continue-on-error: true   # PyAudio on Windows CI can be flaky; tests still run

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run --auto-servernum python -m pytest tests/ -v --tb=short
          else
            python -m pytest tests/ -v --tb=short
          fi

  # -------------------------------------------------------------------------
  # Lint with Ruff (fast — no system deps needed)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check style & imports
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # -------------------------------------------------------------------------
  # Type-check with mypy
  # -------------------------------------------------------------------------
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y portaudio19-dev

      - name: Install deps + mypy
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt mypy

      - name: Run mypy
        run: mypy translator.py main.py keyboard_listener.py voice_input.py input_backend.py --ignore-missing-imports
